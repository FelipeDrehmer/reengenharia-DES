name: Pipeline de Evolucao Segura (CI/CD)

# 1. GATILHO: o pipeline roda APENAS quando uma tag de versão (v1.0.0, v1.1.2...) é enviada.
#    Commits comuns em qualquer branch NÃO disparam a esteira.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE_NAME: sistema-reengenheirado

jobs:
  analise_codigo_e_seguranca:
    name: SonarQube & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo melhora a análise do Sonar

      - name: Configurar Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar o codigo
        run: |
          javac -encoding UTF-8 -d out *.java
          java -cp out Main

      # 2. ANÁLISE ESTÁTICA (SONAR): complexidade ciclomática, code smells e duplicações.
      #    sonar.qualitygate.wait=true (em sonar-project.properties) faz este passo
      #    falhar se o Quality Gate reprovar, bloqueando o deploy.
      - name: Analise SonarCloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ github.ref_name }}

      # 3. VERIFICAÇÃO DE SEGURANÇA (TRIVY)
      #    A action está fixada pelo SHA do commit da v0.35.0, a única versão não
      #    afetada pelo ataque à cadeia de suprimentos de março/2026 (CVE-2026-33634).

      # 3a. Bibliotecas/dependências do repositório
      - name: Trivy - scan do codigo-fonte (bibliotecas)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # 3b. Imagem Docker (inclui a imagem base eclipse-temurin/alpine)
      - name: Build local da imagem para inspecao
        run: docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Trivy - relatorio completo da imagem (informativo)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:scan'
          format: 'table'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy - quality gate da imagem (bloqueia CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:scan'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  build_and_push_docker:
    name: Build e Push para Docker Hub
    needs: analise_codigo_e_seguranca # só roda se o job acima passar!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. BUILD & PUSH
      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
