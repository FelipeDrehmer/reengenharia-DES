# Configuração da análise no SonarCloud (SonarQube Cloud)
# Ajuste "projectKey" e "organization" se o SonarCloud mostrar valores diferentes.
sonar.projectKey=FelipeDrehmer_reengenharia-DES
sonar.organization=felipedrehmer
sonar.projectName=reengenharia-DES

sonar.sources=.
sonar.inclusions=**/*.java
sonar.java.binaries=out
sonar.java.source=21
sonar.sourceEncoding=UTF-8

# Faz o passo do Sonar falhar (e bloquear o deploy) se o Quality Gate reprovar
sonar.qualitygate.wait=true
